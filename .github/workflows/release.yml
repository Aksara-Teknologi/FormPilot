name: Release production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release, contoh v0.2.0"
        required: true
        default: "v0.2.0"
      publish_github_release:
        description: "Buat atau perbarui GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  deployments: write

concurrency:
  group: formpilot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://form-pilot.aksarateknologi.com/
    env:
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      FORMPILOT_HOSTNAME: ${{ vars.FORMPILOT_HOSTNAME }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_ALLOWED_DOMAINS: ${{ vars.GOOGLE_ALLOWED_DOMAINS }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      ALLOWED_TARGET_HOSTS: ${{ vars.ALLOWED_TARGET_HOSTS }}
      MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}
      MCP_INSPECT_TOOL: ${{ vars.MCP_INSPECT_TOOL }}
      MCP_FILL_TOOL: ${{ vars.MCP_FILL_TOOL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release build
        run: npm run check

      - name: Verify and prepare production config
        run: |
          npm run release:verify
          npm run release:config

      - name: Apply D1 migrations
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.json

      - name: Upload Worker secrets
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_SIGNING_SECRET: ${{ secrets.APP_SIGNING_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          printf '%s' "$APP_SIGNING_SECRET" | npx wrangler secret put APP_SIGNING_SECRET --config wrangler.production.json
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --config wrangler.production.json
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --config wrangler.production.json

      - name: Deploy Worker
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --keep-vars --config wrangler.production.json

      - name: Package release artifacts
        run: npm run release:package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: formpilot-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --target "$GITHUB_SHA" --generate-notes --title "FormPilot $RELEASE_TAG"
          fi
